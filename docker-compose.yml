services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: upiguard
      POSTGRES_USER: upiguard
      POSTGRES_PASSWORD: upiguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upiguard -d upiguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    command: gunicorn --worker-class gthread -w 2 --threads 4 --bind 0.0.0.0:5000 app:app
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://upiguard:upiguard@db:5432/upiguard
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env

  celery-worker:
    build: .
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://upiguard:upiguard@db:5432/upiguard
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env

  celery-beat:
    build: .
    command: celery -A celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env

volumes:
  pgdata:
  redisdata:
